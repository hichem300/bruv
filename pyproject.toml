[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bruv"
version = "0.1.0"
description = "no yap, only fax. Typed decisions from TypeSafe Jev or Simple Jev."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "httpx>=0.27,<1",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<14",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
needle = ["cactus-needle>=3.0,<4"]
rlcd-modernbert = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
  "tokenizers>=0.19,<1",
  "huggingface_hub>=1.32.0,<2",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pyinstaller>=6.11,<7",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
bruv = "bruv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bruv"]
artifacts = ["skills/bruv/SKILL.md", "examples/funnel-audit-agent/**"]

[tool.hatch.build.targets.sdist]
exclude = [".memory"]

[tool.hatch.build.targets.wheel.force-include]
"skills/bruv/SKILL.md" = "skills/bruv/SKILL.md"
"examples/funnel-audit-agent" = "examples/funnel-audit-agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"packaging/build_standalone.py" = ["S603"]
"src/bruv/onboarding/credentials.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bruv"]
