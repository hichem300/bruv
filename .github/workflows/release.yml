name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-artifacts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
            target: linux-x86_64
          - runs-on: ubuntu-24.04-arm
            target: linux-aarch64
          - runs-on: macos-13
            target: macos-x86_64
          - runs-on: macos-14
            target: macos-arm64
          - runs-on: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python packaging/build_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: bruv-${{ matrix.target }}
          path: dist/bruv-*

  release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Smoke-test each native artifact
        run: |
          for f in dist/bruv-*; do chmod +x "$f"; "$f" --help; done
      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum bruv-* > SHA256SUMS
      - name: Generate CycloneDX SBOM
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment -o dist/sbom.json
      - name: Sign checksum manifest
        env:
          SIGNING_KEY: ${{ secrets.BRUV_SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            gpg --batch --import <<< "$SIGNING_KEY" 2>/dev/null || true
            cd dist && gpg --batch --detach-sign SHA256SUMS
          fi
      - name: Build Python distributions
        run: python -m build
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bruv-*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/sbom.json
            dist/*.whl
            dist/*.tar.gz

  publish-pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: false  # enable when PyPI trusted publishing is configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
